name: Run and test

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.MD'
    branches:
      - "master"
      - "develop"
      - "ft**"
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches:
      - "master"
      - "develop"
  # To run the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Run and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Init arduino-cli.yaml config file and apply custom configs
        run: |
          # init with defaults
          arduino-cli config init

          # enable_unsafe_install to be able to install libraries via git
          arduino-cli config set library.enable_unsafe_install true

      - name: Install Board support
        run: |
          arduino-cli core update-index
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install libraries
        run: |
          arduino-cli lib update-index
 
          # common libs
          arduino-cli lib install "ArduinoJson"@7.4.3
          arduino-cli lib install "PubSubClient"@2.8.0

          # libs for all sensors
          arduino-cli lib install "TimeAlarms"@1.5.0
          arduino-cli lib install "Time"@1.6.1

          # specific libs to aquire physical measures
          arduino-cli lib install "Adafruit Unified Sensor"@1.1.15
          arduino-cli lib install "Sensirion I2C SHT4x"@1.1.2
          arduino-cli lib install "Sensirion I2C SEN65"@1.1.0
          arduino-cli lib install "Sensirion I2C SCD4x"@1.1.0
          arduino-cli lib install "bsec2"@1.10.2610
          arduino-cli lib install "ld2410"@0.2.2
          arduino-cli lib install "Adafruit TSL2591 Library"@1.4.5

          arduino-cli lib install "Adafruit ADS1X15"@2.6.2

          # specific libs for devices
          arduino-cli lib install "IRremoteESP8266"@2.9.0

          # specific libs for thermostat
          arduino-cli lib install "Adafruit GFX Library"@1.12.6
          arduino-cli lib install "Adafruit SSD1306"@2.5.17
          arduino-cli lib install "Adafruit BusIO"@1.17.4
          arduino-cli lib install "Adafruit MCP9600 Library"@2.0.4

      # to get a list of FQBN you can run: `arduino-cli board listall`
      - name: Building firmwares
        run: |
          # Prepare credentials
          for fw in motion airquality-airpressure lux-temp-hum pm ph water-level ac-beko ac-lg thermostat thermocouple-mcp9601; do
            cp secrets-template "$fw/secrets.h"
          done

          # build
          cd motion
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./motion.ino
          cd ..
          cd airquality-airpressure
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./airquality-airpressure.ino
          cd ..
          cd lux-temp-hum
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./lux-temp-hum.ino
          cd ..
          cd pm
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./pm.ino
          cd ..
          cd ph
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./ph.ino
          cd ..
          cd water-level
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./water-level.ino
          cd ..
          cd ac-beko
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./ac-beko.ino
          cd ..
          cd ac-lg
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./ac-lg.ino
          cd ..
          cd thermocouple-mcp9601
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./thermocouple-mcp9601.ino
          cd ..
          cd thermostat
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./thermostat.ino
          cd ..
  unit-tests:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare firmware headers
        run: |
          # Prepare credentials
          for fw in motion airquality-airpressure lux-temp-hum pm ph water-level ac-beko ac-lg thermostat thermocouple-mcp9601; do
            cp secrets-template "$fw/secrets.h"
          done

      - name: Build and run unit tests
        run: |
          for fw in motion airquality-airpressure lux-temp-hum pm ph water-level ac-beko ac-lg thermostat thermocouple-mcp9601; do
            echo "::group::$fw"
            cmake -S $fw/tests -B $fw/tests/build
            cmake --build $fw/tests/build --parallel
            ctest --test-dir $fw/tests/build --output-on-failure
            echo "::endgroup::"
          done

  simulator-build:
    name: MCP9600 simulator (ESP-IDF, ESP32-S3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build MCP9600 simulator
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: thermostat-mcp9600-simulator

  mcp9601-simulator-build:
    name: MCP9601 simulator (ESP-IDF, ESP32-S3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build MCP9601 simulator
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          path: thermocouple-mcp9601-simulator
