name: Run and test

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.MD'
    branches:
      - "master"
      - "develop"
      - "ft**"
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches:
      - "master"
      - "develop"
  # To run the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
        matrix:
          esp-devices: [esp32, esp32s2, esp32s3]

    name: Run and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Init arduino-cli.yaml config file and apply custom configs
        run: |
          # init with defaults
          arduino-cli config init

          # enable_unsafe_install to be able to install libraries via git
          arduino-cli config set library.enable_unsafe_install true

      - name: Install Board support
        run: |
          arduino-cli core update-index
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib update-index
 
          # common libs
          arduino-cli lib install "ArduinoJson"@7.4.3
          arduino-cli lib install "PubSubClient"@2.8.0

          # libs for all sensors
          arduino-cli lib install "TimeAlarms"@1.5.0
          arduino-cli lib install "Time"@1.6.1

          # specific libs to aquire physical measures
          arduino-cli lib install "Adafruit Unified Sensor"@1.1.15
          arduino-cli lib install "DHT sensor library"@1.4.6
          arduino-cli lib install "XENSIV Digital Pressure Sensor"@1.0.2
          arduino-cli lib install "Grove - Air quality sensor"@1.0.2
          arduino-cli lib install "Grove - Digital Light Sensor"@2.0.0

          # specific libs for devices
          arduino-cli lib install "IRremoteESP8266"@2.9.0

          # specific libs for thermostat
          arduino-cli lib install "Adafruit GFX Library"@1.12.6
          arduino-cli lib install "Adafruit SSD1306"@2.5.16
          arduino-cli lib install "Adafruit BusIO"@1.17.4
          arduino-cli lib install "Adafruit MCP9600 Library"@2.0.4

      # to get a list of FQBN you can run: `arduino-cli board listall`
      - name: Building firmwares for ${{ matrix.esp-devices }}
        run: |
          # Prepare sensor.h files based on `secrets-template`, because
          # we don't need real config files to build all firmwares in CI.
          cp secrets-template airquality-pir/secrets.h
          cp secrets-template barometer/secrets.h
          cp secrets-template dht-light/secrets.h
          cp secrets-template power-outage/secrets.h
          cp secrets-template ac-beko/secrets.h
          cp secrets-template ac-lg/secrets.h
          cp secrets-template thermostat/secrets.h

          # build
          cd airquality-pir
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./airquality-pir.ino
          cd ..
          cd barometer
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./barometer.ino
          cd ..
          cd dht-light
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./dht-light.ino
          cd ..
          cd power-outage
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./power-outage.ino
          cd ..
          cd ac-beko
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./ac-beko.ino
          cd ..
          cd ac-lg
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./ac-lg.ino
          cd ..
          cd thermostat
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.esp-devices }} ./thermostat.ino
          cd ..
  unit-tests:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy secrets template to all firmwares
        run: |
          # Prepare sensor.h files based on `secrets-template`, because
          # we don't need real config files to build all firmwares in CI.
          cp secrets-template airquality-pir/secrets.h
          cp secrets-template barometer/secrets.h
          cp secrets-template dht-light/secrets.h
          cp secrets-template power-outage/secrets.h
          cp secrets-template ac-beko/secrets.h
          cp secrets-template ac-lg/secrets.h
          cp secrets-template thermostat/secrets.h

      - name: Build and run unit tests
        run: |
          for fw in airquality-pir barometer dht-light power-outage ac-beko ac-lg thermostat; do
            echo "::group::$fw"
            cmake -S $fw/tests -B $fw/tests/build
            cmake --build $fw/tests/build --parallel
            ctest --test-dir $fw/tests/build --output-on-failure
            echo "::endgroup::"
          done
